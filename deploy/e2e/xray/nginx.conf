# Test-only Reality target of the Xray e2e suite. The certificate and key in this directory are
# committed on purpose and protect nothing.
server {
    listen 80;
    default_type text/plain;
    location / {
        return 200 "usher-e2e-target\n";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name target.e2e;
    ssl_certificate     /etc/nginx/certs/target.crt;
    ssl_certificate_key /etc/nginx/certs/target.key;
    ssl_protocols       TLSv1.3;
    default_type text/plain;
    location / {
        return 200 "usher-e2e-target\n";
    }
}
