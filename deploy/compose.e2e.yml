name: ushere2e
services:
  awg:
    image: ghcr.io/mrcsin/awg-grpc:v0.1.0
    # Docker's init is PID 1 and reaps orphans of awg-quick and PostUp commands.
    init: true
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      e2e:
        ipv4_address: 172.30.99.2
    volumes:
      - ./e2e/awg:/etc/amnezia/amneziawg:ro
      - awg-sock:/run/awg-grpc
    environment:
      AWG_GRPC_SOCKET_GID: ${E2E_GID:-0}
  usher:
    build:
      context: ..
    image: usher:e2e
    user: ${E2E_UID:-0}:${E2E_GID:-0}
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    depends_on:
      awg:
        condition: service_healthy
    networks: [e2e]
    volumes:
      - ../.e2e/config:/srv/usher/config:ro
      - ../.e2e/clients:/srv/usher/clients
      - ../.e2e/state:/srv/usher/state
      - awg-sock:/run/awg-grpc
    environment:
      USHER_HOST: 172.30.99.2
      USHER_AWG_SOCKET: /run/awg-grpc/awg.sock
      USHER_DNS: 1.1.1.1
  # Handshake peer of the e2e test; test/e2e writes its config to ../.e2e/client.
  client:
    profiles: [handshake]
    image: ghcr.io/mrcsin/awg-grpc:v0.1.0
    init: true
    cap_add: [NET_ADMIN]
    networks: [e2e]
    # The image healthcheck probes the wrapper socket, which the client does not serve. This one
    # turns healthy once awg-quick up succeeded, so up --wait returns with the tunnel configured.
    healthcheck:
      test: ["CMD", "test", "-e", "/run/awgc0-up"]
      interval: 1s
      retries: 30
    entrypoint: ["sh", "-c", "awg-quick up awgc0 && touch /run/awgc0-up && sleep infinity"]
    volumes:
      - ../.e2e/client:/etc/amnezia/amneziawg:ro
networks:
  e2e:
    ipam:
      config:
        - subnet: 172.30.99.0/24
volumes:
  awg-sock:
